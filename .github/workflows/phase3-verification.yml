name: Phase 3 browser verification
on:
  push:
    branches: [phase3-verification]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Prepare the two licensed habitat scans
        run: |
          python -m pip install Pillow --quiet
          python scripts/prepare-habitats.py
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
        env:
          AIRP_SOFTWARE_GL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-screenshots
          path: |
            test-results/
            public/assets/places/forest_floor.webp
            public/assets/places/sand_02.webp

  review:
    name: Review public game assets (${{ matrix.set }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        set: [habitats, gallery]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase3-screenshots
      - name: Prepare inspectable game imagery
        env:
          ASSET_SET: ${{ matrix.set }}
        run: |
          python -m pip install Pillow --quiet
          python - <<'PY'
          import base64, hashlib, os
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          def record(path,data):
              print('AIRP-SIZE',path,len(data),hashlib.sha256(data).hexdigest())
              for i in range(0,len(data),3072):
                  print('AIRP-IMAGE',path,i,base64.b64encode(data[i:i+3072]).decode())
          if os.environ['ASSET_SET']=='habitats':
              for name in ('forest_floor','sand_02'):
                  p=Path('public/assets/places')/(name+'.webp')
                  record(str(p),p.read_bytes())
          else:
              panels=[('ground','Basin Boulevard'),('residential','Linden Ward'),('villa','Villa Court'),('harbor','Port Mariner'),('forest','Silverpine Forest'),('coast','Saltwood Strand')]
              width,height=640,400
              sheet=Image.new('RGB',(width*2,(height+36)*3),'#192320')
              draw=ImageDraw.Draw(sheet)
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
              for i,(file,label) in enumerate(panels):
                  x,y=i%2*width,i//2*(height+36)
                  shot=Image.open('test-results/'+file+'.jpg').convert('RGB')
                  sheet.paste(shot.resize((width,height),Image.Resampling.LANCZOS),(x,y))
                  draw.text((x+14,y+7+height),label,font=font,fill='#ececda')
              output=BytesIO()
              sheet.save(output,'JPEG',quality=84,optimize=True)
              record('docs/phase3/world-survey.jpg',output.getvalue())
          PY
