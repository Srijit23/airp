name: Phase 3 browser verification
on:
  push:
    branches: [phase3-verification]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
        env:
          AIRP_SOFTWARE_GL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-screenshots
          path: test-results/
