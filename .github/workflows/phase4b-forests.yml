name: Forest and world verification
on:
  push:
    branches: [phase4b-dense-forests]
    paths: ['src/**','public/**','scripts/**','test/**','package*.json','.github/workflows/phase4b-forests.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [forests, world, showcase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - if: matrix.suite == 'forests'
        run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Inspect the running game
        env:
          SUITE: ${{ matrix.suite }}
          AIRP_SOFTWARE_GL: '1'
        run: |
          case "$SUITE" in
            forests) node scripts/forest-browser-check.js ;;
            world) node scripts/browser-check.js ;;
            showcase) node scripts/tree-browser-check.js ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-${{ matrix.suite }}
          path: test-results/
  lod-comparison:
    name: Matched high-preset roadside benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Measure the approved forest and candidate on the same runner
        env:
          AIRP_SOFTWARE_GL: '1'
          LOD_SPECIES: pine
          LOD_DISTANCES: '20,50,100'
          LOD_CAPTURE_ONLY: '1'
        run: |
          git worktree add --detach "$RUNNER_TEMP/airp-base" eaf5a69f0335533b1d14c70fb8b7bef9b4c81d0d
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/airp-base/node_modules"
          cp scripts/forest-lod-check.js "$RUNNER_TEMP/airp-base/scripts/"
          (cd "$RUNNER_TEMP/airp-base" && LOD_OUTPUT="$GITHUB_WORKSPACE/test-results/comparison/before" node scripts/forest-lod-check.js)
          LOD_OUTPUT=test-results/comparison/after node scripts/forest-lod-check.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-roadside-before-after
          path: test-results/comparison
